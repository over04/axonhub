# AxonHub Docker Compose Configuration
# 基于 https://github.com/over04/axonhub
# 环境变量请在 .env 文件中配置

services:
  axonhub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axonhub-app
    extra_hosts:
      - "Over04Nas:host-gateway"
    env_file:
      - .env
    ports:
      - "8090:8090"
    volumes:
      - ./config.yml:/app/config.yml:ro
    networks:
      - axonhub-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8090/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  axonhub-network:
    driver: bridge
